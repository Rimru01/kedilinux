---
modules-search: [ local ]

instances:
- id:       kedi-setup
  module:   shellprocess
  config:   kedi-setup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpio
  - users
  - shellprocess@kedi-setup
  - displaymanager
  - hwclock
  - services-openrc
  - grubcfg
  - removeuser
  - packages
  - bootloader
  - umount
- show:
  - finished

branding: kedi

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
